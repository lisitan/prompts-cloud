<!DOCTYPE html>
<html lang="zh-CN" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>词匣子 - 收集整理你的AI提示词</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-web/style.css" />
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"LXGW WenKai Screen"', '-apple-system', 'sans-serif'] },
                    colors: {
                        // 重新调教的灰阶，适配深色模式
                        zinc: { 50: '#f9fafb', 100: '#f4f4f5', 200: '#e4e4e7', 300: '#d4d4d8', 700: '#3f3f46', 800: '#27272a', 900: '#18181b', 950: '#09090b' },
                    },
                    boxShadow: {
                        'soft': '0 2px 10px rgba(0,0,0,0.03)',
                        'glow': '0 0 20px rgba(255,255,255,0.05)', // 暗色模式微光
                    },
                    animation: {
                        'check-in': 'checkIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
                    },
                    keyframes: {
                        checkIn: { '0%': { transform: 'scale(0.5)', opacity: 0 }, '100%': { transform: 'scale(1)', opacity: 1 } },
                    }
                }
            }
        }
    </script>

    <style>
        /* 平滑的颜色过渡 */
        body { transition: background-color 0.3s ease, color 0.3s ease; }
        
        /* 瀑布流 */
        .masonry-grid { column-count: 1; column-gap: 1.5rem; }
        @media (min-width: 768px) { .masonry-grid { column-count: 2; } }
        @media (min-width: 1280px) { .masonry-grid { column-count: 3; } }
        @media (min-width: 1800px) { .masonry-grid { column-count: 4; } }
        .masonry-item { break-inside: avoid; margin-bottom: 1.5rem; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* 选中色：随主题变化 */
        ::selection { background: #e4e4e7; color: black; }
        .dark ::selection { background: #3f3f46; color: white; }

        /* 液体感交互 */
        .liquid-card {
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.2s ease, background-color 0.3s;
        }
        .liquid-card:active { transform: scale(0.96); } /* 按压感更明显 */
        
        /* 按钮触摸反馈 */
        .btn-press:active { transform: scale(0.92); }
    </style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen flex flex-col">

<div id="app" class="flex-grow flex flex-col w-full max-w-[1800px] mx-auto px-6 sm:px-12 pb-24" @click="closeMenus" @contextmenu.prevent>
    
    <header class="sticky top-0 z-50 bg-zinc-50/90 dark:bg-zinc-950/90 backdrop-blur-lg py-8 flex items-center justify-between transition-all">
        <div class="flex items-center gap-6 cursor-pointer group" @click="resetFilter">
            <div class="w-10 h-10 rounded-2xl bg-zinc-900 dark:bg-white text-white dark:text-black flex items-center justify-center shadow-soft btn-press transition-transform">
                <i class="ph-bold ph-sparkle text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight hidden sm:block">词匣子</h1>
            
            <div class="relative group w-64 hidden md:block ml-4">
                <input v-model="searchQuery" type="text" placeholder="搜索..." class="w-full bg-transparent border-none p-0 text-sm font-medium placeholder-zinc-400 focus:ring-0 text-zinc-900 dark:text-zinc-100">
                <div class="absolute bottom-[-4px] left-0 w-0 h-[2px] bg-zinc-900 dark:bg-white rounded-full transition-all duration-300 group-focus-within:w-full"></div>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <button @click.stop="toggleTheme" class="w-10 h-10 rounded-full hover:bg-zinc-200 dark:hover:bg-zinc-800 flex items-center justify-center transition-colors text-zinc-500 dark:text-zinc-400">
                <i class="ph-fill text-lg" :class="isDark ? 'ph-moon-stars' : 'ph-sun'"></i>
            </button>

            <div class="relative">
                <button @click.stop="toggleMenu" class="w-10 h-10 rounded-full hover:bg-zinc-200 dark:hover:bg-zinc-800 flex items-center justify-center transition-colors text-zinc-500 dark:text-zinc-400" :class="{'bg-zinc-200 dark:bg-zinc-800': showMenu}">
                    <i class="ph-bold ph-dots-three-vertical text-lg"></i>
                </button>
                <transition enter-active-class="transition ease-out duration-200" enter-from-class="opacity-0 scale-90 translate-y-2" enter-to-class="opacity-100 scale-100 translate-y-0" leave-active-class="transition ease-in duration-150" leave-from-class="opacity-100 scale-100 translate-y-0" leave-to-class="opacity-0 scale-90 translate-y-2">
                    <div v-if="showMenu" class="absolute right-0 top-full mt-3 w-56 bg-white dark:bg-zinc-900 rounded-2xl shadow-xl border border-zinc-100 dark:border-zinc-800 p-2 z-50 origin-top-right">
                        <div class="px-3 py-2 text-xs font-bold text-zinc-400 uppercase tracking-wider">数据管理</div>
                        <button @click="exportXLSX" class="w-full text-left px-3 py-2.5 rounded-xl text-sm font-medium text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors flex items-center gap-2"><i class="ph-fill ph-microsoft-excel-logo text-green-500"></i> 导出 Excel</button>
                        <button @click="exportJSON" class="w-full text-left px-3 py-2.5 rounded-xl text-sm font-medium text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors flex items-center gap-2"><i class="ph-fill ph-file-json text-yellow-500"></i> 备份 JSON</button>
                        <div class="h-px bg-zinc-100 dark:bg-zinc-800 my-1"></div>
                        <label class="w-full text-left px-3 py-2.5 rounded-xl text-sm font-medium text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors cursor-pointer flex items-center gap-2">
                            <i class="ph-fill ph-upload-simple text-blue-500"></i> 导入 Excel/JSON 
                            <input type="file" @change="handleImport" accept=".json,.xlsx,.xls" class="hidden">
                        </label>
                    </div>
                </transition>
            </div>
            
            <button @click="openModal()" class="bg-zinc-900 dark:bg-white text-white dark:text-black px-6 py-2.5 rounded-full text-sm font-bold shadow-soft hover:shadow-lg hover:scale-105 active:scale-95 transition-all flex items-center gap-2">
                <i class="ph-bold ph-plus"></i> <span class="hidden sm:inline">新建</span>
            </button>
        </div>
    </header>

    <div v-if="sortedTags.length > 0" class="mb-10 flex flex-wrap gap-3 items-center">
        <button 
            v-for="tag in sortedTags" 
            :key="tag.name"
            @click="toggleTagFilter(tag.name)"
            @contextmenu.prevent="togglePin(tag.name)"
            class="group relative px-4 py-2 rounded-full text-sm font-bold transition-all duration-200 border btn-press"
            :class="searchQuery === tag.name 
                ? 'bg-zinc-900 dark:bg-white text-white dark:text-black border-transparent shadow-md' 
                : 'bg-white dark:bg-zinc-900 text-zinc-500 dark:text-zinc-400 border-zinc-200 dark:border-zinc-800 hover:border-zinc-400 dark:hover:border-zinc-600'"
        >
            <span class="flex items-center gap-1.5">
                {{ tag.name }}
                <i v-if="tag.isPinned" class="ph-fill ph-push-pin text-[10px]" :class="searchQuery === tag.name ? 'opacity-100' : 'opacity-50'"></i>
            </span>
        </button>
    </div>

    <div class="masonry-grid" v-if="filteredPrompts.length > 0">
        <div 
            v-for="prompt in filteredPrompts" 
            :key="prompt.id" 
            class="masonry-item liquid-card group relative bg-white dark:bg-zinc-900 p-8 rounded-[2rem] shadow-soft dark:shadow-none dark:border dark:border-zinc-800 cursor-pointer overflow-hidden"
            @click="copyToClipboard(prompt)"
        >
            <h3 class="text-lg font-bold text-zinc-900 dark:text-white mb-4 leading-snug tracking-tight">{{ prompt.title }}</h3>
            
            <div class="relative">
                <p class="text-zinc-600 dark:text-zinc-400 text-[15px] leading-loose whitespace-pre-wrap font-[LXGW WenKai Screen] line-clamp-[15] group-hover:text-zinc-900 dark:group-hover:text-zinc-200 transition-colors">{{ prompt.content }}</p>
            </div>

            <div class="mt-6 pt-4 border-t border-zinc-100 dark:border-zinc-800 flex justify-between items-center">
                <div class="flex gap-2">
                    <span v-for="tag in prompt.tags" :key="tag" @click.stop="toggleTagFilter(tag)" class="text-xs font-medium text-zinc-400 hover:text-zinc-900 dark:hover:text-white cursor-pointer transition-colors px-2 py-1 hover:bg-zinc-100 dark:hover:bg-zinc-800 rounded-lg">#{{ tag }}</span>
                </div>
                <div class="flex gap-1 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity duration-100">
                    <button @click.stop="openModal(prompt)" class="w-9 h-9 rounded-full hover:bg-zinc-100 dark:hover:bg-zinc-800 flex items-center justify-center text-zinc-400 hover:text-zinc-900 dark:hover:text-white transition-colors cursor-pointer"><i class="ph-bold ph-pencil-simple pointer-events-none"></i></button>
                    <button @click.stop="deletePrompt(prompt.id)" class="w-9 h-9 rounded-full hover:bg-red-50 dark:hover:bg-red-900/20 flex items-center justify-center text-zinc-400 hover:text-red-500 transition-colors cursor-pointer"><i class="ph-bold ph-trash pointer-events-none"></i></button>
                </div>
            </div>

            <div v-if="copiedId === prompt.id" class="absolute inset-0 flex items-center justify-center bg-zinc-50/80 dark:bg-zinc-950/80 backdrop-blur-[2px] rounded-[2rem] animate-check-in z-10">
                <div class="flex flex-col items-center gap-2">
                    <div class="w-12 h-12 rounded-full bg-zinc-900 dark:bg-white text-white dark:text-black flex items-center justify-center shadow-xl">
                        <i class="ph-bold ph-check text-xl"></i>
                    </div>
                    <span class="text-xs font-bold text-zinc-900 dark:text-white tracking-widest uppercase">已复制</span>
                </div>
            </div>
        </div>
    </div>

    <div v-else class="flex-grow flex flex-col items-center justify-center opacity-40">
        <div class="w-20 h-20 rounded-full bg-zinc-100 dark:bg-zinc-900 flex items-center justify-center mb-4">
            <i class="ph-duotone ph-wind text-4xl text-zinc-300 dark:text-zinc-700"></i>
        </div>
        <p class="text-sm text-zinc-400 font-medium">空空如也</p>
    </div>

    <div v-if="showModal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-8" @click.self="closeModal">
        <div class="absolute inset-0 bg-zinc-100/90 dark:bg-black/90 backdrop-blur-sm transition-opacity"></div>
        <div class="relative w-full max-w-3xl bg-white dark:bg-zinc-900 shadow-2xl rounded-[2.5rem] flex flex-col max-h-[90vh] overflow-hidden animate-[check-in_0.25s_ease-out] border border-zinc-100 dark:border-zinc-800">
            <div class="p-10 flex flex-col h-full overflow-y-auto">
                <div class="flex justify-between items-start mb-6">
                    <input v-model="currentPrompt.title" class="w-full text-3xl font-bold bg-transparent border-none p-0 focus:ring-0 placeholder-zinc-300 dark:placeholder-zinc-700 text-zinc-900 dark:text-white" placeholder="标题">
                    <button @click="closeModal" class="w-10 h-10 rounded-full bg-zinc-100 dark:bg-zinc-800 text-zinc-500 hover:text-zinc-900 dark:hover:text-white flex items-center justify-center transition-colors"><i class="ph-bold ph-x text-lg"></i></button>
                </div>
                <textarea v-model="currentPrompt.content" class="flex-grow w-full bg-transparent border-none p-0 focus:ring-0 text-lg leading-loose resize-none placeholder-zinc-300 dark:placeholder-zinc-700 text-zinc-700 dark:text-zinc-300 font-[LXGW WenKai Screen]" placeholder="提示词记录在这里..."></textarea>
                <div class="mt-8 pt-6 border-t border-zinc-100 dark:border-zinc-800 flex flex-col sm:flex-row items-center gap-4 justify-between">
                    <div class="flex items-center gap-3 w-full sm:w-auto bg-zinc-50 dark:bg-zinc-950/50 px-4 py-2 rounded-xl border border-zinc-100 dark:border-zinc-800">
                        <i class="ph-duotone ph-hash text-zinc-400"></i>
                        <input v-model="currentPrompt.tagsInput" class="w-full bg-transparent border-none p-0 text-sm focus:ring-0 placeholder-zinc-400 text-zinc-700 dark:text-zinc-300" placeholder="标签 (逗号分隔)">
                    </div>
                    <button @click="savePrompt" class="w-full sm:w-auto px-8 py-2.5 bg-zinc-900 dark:bg-white text-white dark:text-black text-sm font-bold rounded-full hover:scale-105 active:scale-95 transition-all shadow-lg">保存</button>
                </div>
            </div>
        </div>
    </div>

    <transition name="toast">
        <div v-if="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[200] bg-zinc-900 dark:bg-white text-white dark:text-black px-6 py-3 rounded-full shadow-xl flex items-center gap-3">
            <span class="text-xs font-bold tracking-wide">{{ toast }}</span>
        </div>
    </transition>

</div>

<script>
    const { createApp } = Vue;

    createApp({
        data() {
            return {
                prompts: [],
                pinnedTags: [],
                searchQuery: '',
                showModal: false,
                showMenu: false,
                isDark: false,
                copiedId: null,
                toast: null,
                currentPrompt: { id: null, title: '', content: '', tagsInput: '' },
                defaultPrompts: [{ id: 1, title: 'Liquid Air', content: '更圆润的倒角，更深的黑色，更自然的交互。\n\n现在支持 Excel 和 JSON 双向导入导出。', tags: ['更新'], timestamp: Date.now() }]
            }
        },
        computed: {
            filteredPrompts() {
                const query = this.searchQuery.toLowerCase().trim();
                if (!query) return this.prompts.sort((a, b) => b.timestamp - a.timestamp);
                return this.prompts.filter(p => 
                    p.title.toLowerCase().includes(query) || 
                    p.content.toLowerCase().includes(query) ||
                    p.tags.some(t => t.toLowerCase().includes(query))
                ).sort((a, b) => b.timestamp - a.timestamp);
            },
            sortedTags() {
                const counts = {};
                this.prompts.forEach(p => { p.tags.forEach(t => { if(t) counts[t] = (counts[t] || 0) + 1; }); });
                const pinnedSet = new Set(this.pinnedTags);
                return Object.keys(counts).map(key => ({
                    name: key, count: counts[key], isPinned: pinnedSet.has(key)
                })).sort((a, b) => {
                    if (a.isPinned && !b.isPinned) return -1;
                    if (!a.isPinned && b.isPinned) return 1;
                    if (b.count !== a.count) return b.count - a.count;
                    return a.name.localeCompare(b.name);
                });
            }
        },
        mounted() {
            this.loadFromStorage();
            this.initTheme();
        },
        methods: {
            toggleMenu() { this.showMenu = !this.showMenu; },
            closeMenus() { if (this.showMenu) this.showMenu = false; },
            loadFromStorage() {
                const savedPrompts = localStorage.getItem('liquidPrompts');
                this.prompts = savedPrompts ? JSON.parse(savedPrompts) : this.defaultPrompts;
                const savedPins = localStorage.getItem('liquidPinnedTags');
                this.pinnedTags = savedPins ? JSON.parse(savedPins) : [];
            },
            saveToStorage() { localStorage.setItem('liquidPrompts', JSON.stringify(this.prompts)); },
            togglePin(tagName) {
                const index = this.pinnedTags.indexOf(tagName);
                if (index > -1) { this.pinnedTags.splice(index, 1); } 
                else { this.pinnedTags.push(tagName); }
                localStorage.setItem('liquidPinnedTags', JSON.stringify(this.pinnedTags));
            },
            toggleTagFilter(tag) { this.searchQuery = (this.searchQuery === tag) ? '' : tag; },
            
            initTheme() {
                if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    this.isDark = true; document.documentElement.classList.add('dark');
                } else {
                    this.isDark = false; document.documentElement.classList.remove('dark');
                }
            },
            toggleTheme() {
                this.isDark = !this.isDark;
                if (this.isDark) { document.documentElement.classList.add('dark'); localStorage.theme = 'dark'; }
                else { document.documentElement.classList.remove('dark'); localStorage.theme = 'light'; }
            },

            handleImport(event) {
                this.showMenu = false;
                const file = event.target.files[0];
                if (!file) return;
                const fileName = file.name.toLowerCase();
                if (fileName.endsWith('.json')) { this.importJSON(file); } 
                else if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls')) { this.importExcel(file); }
                event.target.value = '';
            },
            importJSON(file) {
                const reader = new FileReader();
                reader.onload = (e) => { try { this.mergeData(JSON.parse(e.target.result)); } catch(err) { alert('JSON Error'); } };
                reader.readAsText(file);
            },
            importExcel(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, {type: 'array'});
                        const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                        const mappedData = jsonData.map(row => ({
                            id: Date.now() + Math.random(),
                            title: row['标题'] || row['Title'] || '无题',
                            content: row['内容'] || row['Content'] || '',
                            tags: (row['标签'] || row['Tags'] || '').split(/[,，]/).map(t=>t.trim()).filter(t=>t),
                            timestamp: Date.now()
                        }));
                        this.mergeData(mappedData);
                    } catch(err) { alert('Excel Error'); }
                };
                reader.readAsArrayBuffer(file);
            },
            mergeData(newData) {
                if (!Array.isArray(newData)) return;
                if(confirm(`导入 ${newData.length} 条?`)) {
                    const existingTitles = new Set(this.prompts.map(p => p.title));
                    const uniqueNewData = newData.filter(p => !existingTitles.has(p.title)).map(p => ({...p, id: Date.now() + Math.random(), tags: p.tags || []}));
                    this.prompts = [...uniqueNewData, ...this.prompts];
                    this.saveToStorage();
                    this.showToast(`已导入 ${uniqueNewData.length} 条`);
                }
            },
            exportXLSX() {
                this.showMenu = false;
                const ws_data = this.prompts.map(p => ({ "标题": p.title, "标签": p.tags.join(', '), "内容": p.content, "创建日期": new Date(p.timestamp).toLocaleDateString() }));
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.json_to_sheet(ws_data);
                ws['!cols'] = [{wch: 20}, {wch: 20}, {wch: 50}, {wch: 15}]; // 设置列宽
                XLSX.utils.book_append_sheet(wb, ws, "Prompts");
                XLSX.writeFile(wb, "Prompts_Backup.xlsx");
            },
            exportJSON() {
                this.showMenu = false;
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.prompts, null, 2));
                const anchor = document.createElement('a');
                anchor.href = dataStr; anchor.download = "Prompts_Backup.json"; anchor.click();
            },

            formatDate(ts) { return new Date(ts).toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, '.'); },
            openModal(prompt = null) {
                this.showMenu = false;
                this.currentPrompt = prompt ? { ...prompt, tagsInput: prompt.tags.join(', ') } : { id: null, title: '', content: '', tagsInput: '' };
                this.isEditing = !!prompt; this.showModal = true;
            },
            closeModal() { this.showModal = false; },
            savePrompt() {
                if (!this.currentPrompt.title.trim()) return this.showToast('需要标题');
                const tags = this.currentPrompt.tagsInput.split(/[,，、]/).map(t=>t.trim()).filter(t=>t);
                const data = { ...this.currentPrompt, tags, timestamp: Date.now() };
                if (this.isEditing) {
                    const idx = this.prompts.findIndex(p => p.id === this.currentPrompt.id);
                    this.prompts[idx] = { ...data, id: this.currentPrompt.id };
                } else {
                    this.prompts.unshift({ ...data, id: Date.now() });
                }
                this.saveToStorage(); this.closeModal(); this.showToast('已保存');
            },
            deletePrompt(id) { if(confirm('删除?')) { this.prompts = this.prompts.filter(p => p.id !== id); this.saveToStorage(); } },
            async copyToClipboard(prompt) {
                try { 
                    await navigator.clipboard.writeText(prompt.content); 
                    this.copiedId = prompt.id;
                    setTimeout(() => { if(this.copiedId === prompt.id) this.copiedId = null; }, 1200);
                } catch(e) {} 
            },
            showToast(msg) { this.toast = msg; setTimeout(() => this.toast = null, 2000); },
            resetFilter() { this.searchQuery = ''; }
        }
    }).mount('#app');
</script>
<style>
    .toast-enter-active, .toast-leave-active { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .toast-enter-from, .toast-leave-to { opacity: 0; transform: translateY(20px); }
</style>
</body>
</html>
